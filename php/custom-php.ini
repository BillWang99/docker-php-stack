; PHP 文件上傳設定
; 影片上限調至 250M(手語認證題庫題幹影片需求,Laravel 端 validate max:256000 KB)
; post_max_size 略大於 upload_max_filesize,留多欄位空間;memory_limit 同步上抬
upload_max_filesize = 300M
post_max_size = 320M
; 影片以 base64 存 DB:上傳時 raw(250M)+base64(~340M) 並存,串流時 base64 解碼 + 切 Range 暫存
; 峰值約 600M+,memory_limit 拉至 1024M 避免 OOM
memory_limit = 1024M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20

; 其他優化設定
date.timezone = Asia/Taipei
